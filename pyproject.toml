[project]
name = "niri-desktop-continuity"
version = "0.1.1"
description = "Save your niri desktop and reopen it after a reboot: windows on their workspaces, in column order"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["niri", "wayland", "desktop", "session", "restore", "reboot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tryingET/niri-desktop-continuity"
Issues = "https://github.com/tryingET/niri-desktop-continuity/issues"

[project.scripts]
niri-desktop-continuity = "niri_desktop_continuity.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niri_desktop_continuity"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/",
    "tests/",
    "scripts/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "DESIGN.md",
    "Justfile",
    "pyproject.toml",
    "uv.lock",
    "docs/usage.md",
    "docs/architecture.md",
    "docs/recovery.md",
    "docs/project/2026-09-06-integrated-reconstruction-design.md",
    "docs/project/2026-09-06-integrated-reconstruction-plan.md",
    "docs/project/2026-09-06-integrated-reconstruction-protocol.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
