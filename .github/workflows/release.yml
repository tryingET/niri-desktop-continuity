name: release

# Pushing a tag vX.Y.Z builds once from it, validates it, uploads the wheel and sdist to PyPI
# through trusted publishing (no stored token) and then creates the GitHub Release together with
# the same files, SHA256SUMS and notes from CHANGELOG.md. Releases here are immutable, so files
# cannot be attached after a release is published. See docs/release.md.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # The same test environment as ci.yml; see the reasons there.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Allow unprivileged user namespaces (the jail tests create them; AppArmor blocks them)
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: uv sync --frozen --group dev
      - name: Cache the index entries the installed-wheel tests resolve offline
        run: |
          uv export --frozen --only-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/dev.txt"
          uv venv "$RUNNER_TEMP/warm"
          uv pip install --python "$RUNNER_TEMP/warm/bin/python" -r "$RUNNER_TEMP/dev.txt"
      - name: The tag names the packaged version
        run: test "v$(uv run --frozen niri-desktop-continuity --version | cut -d' ' -f2)" = "$GITHUB_REF_NAME"
      - run: umask 022 && just ci # fixtures create 0755 directories the store must refuse
      - run: cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/niri-desktop-continuity/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: rm dist/SHA256SUMS dist/RELEASE_NOTES.md # PyPI takes distributions only
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
