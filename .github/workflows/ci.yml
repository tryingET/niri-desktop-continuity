name: ci

on:
  push:
    branches: [main] # tags run the same checks in release.yml before publishing
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lint, formatting, the full test suite, the privacy/portability check, build and an
    # installed-wheel smoke. Tests use fabricated fixtures and never contact a compositor.
    # Ubuntu 26.04 (kernel 7.0): the exited-shell tests use the pidfd namespace ioctls and check
    # their numbers against the system's linux/pidfd.h; both are newer than Ubuntu 24.04's.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # The namespace tests chroot into a jail that binds only /usr and the checkout, so the venv
      # uses the system interpreter, never a downloaded one.
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
      # Test drivers bind AF_UNIX sockets under TMPDIR: a short, real directory, never a symlink.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Allow unprivileged user namespaces (the jail tests create them; AppArmor blocks them)
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      # The jail binds /usr only: Ubuntu's cc resolves through /etc/alternatives and setup-uv
      # installs uv elsewhere. The jail tests skip until the runner kernel is >= 7.2.6.
      - name: Keep cc and uv inside /usr for the native jail
        run: |
          sudo ln -sfn "$(readlink -f /usr/bin/cc)" /usr/bin/cc
          sudo install -m 0755 "$(command -v uv)" /usr/bin/uv
      - run: uv sync --frozen --group dev
      - name: Cache the index entries the installed-wheel tests resolve offline
        run: |
          uv export --frozen --only-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/dev.txt"
          uv venv "$RUNNER_TEMP/warm"
          uv pip install --python "$RUNNER_TEMP/warm/bin/python" -r "$RUNNER_TEMP/dev.txt"
      - run: umask 022 && just ci # fixtures create 0755 directories the store must refuse
