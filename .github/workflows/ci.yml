name: ci

on:
  push:
    branches: [main] # tags run the same checks in release.yml before publishing
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lint, formatting, the full test suite, the privacy/portability check, build and an
    # installed-wheel smoke. Tests use fabricated fixtures and never contact a compositor.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --frozen --group dev
      - run: just ci
